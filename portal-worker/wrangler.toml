# Referência para wrangler dev (teste local). Em produção o deploy usa tools/gerar-deploy-cloudflare.py (arquivos embutidos no Worker; ver docs/CLOUDFLARE.md).
name = "minha-casa-em-ordem"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "minha-casa-acesso"
database_id = "SUBSTITUIR-PELO-ID-DO-D1"

# Segredo (não vai para o repositório): PEPPER  ->  wrangler secret put PEPPER
